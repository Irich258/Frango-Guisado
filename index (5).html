<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf8f3" />
  <title>Frango Guisado — AR</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#faf8f3;color:#181818}
    body{display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(460px,100%);background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:28px;padding:26px;box-shadow:0 20px 70px rgba(0,0,0,.08)}
    .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#777;margin-bottom:10px}
    h1{font-size:34px;line-height:1.05;margin:0 0 24px;font-weight:750;letter-spacing:-.03em}
    .preview{height:270px;border-radius:22px;background:linear-gradient(145deg,#f3efe7,#e8e1d5);display:grid;place-items:center;margin-bottom:20px;position:relative;overflow:hidden}
    .plate{width:165px;height:165px;border-radius:50%;background:#fff;border:8px solid rgba(255,255,255,.8);box-shadow:0 22px 35px rgba(0,0,0,.14), inset 0 0 0 1px rgba(0,0,0,.06);display:grid;place-items:center}
    .food{width:108px;height:88px;border-radius:48% 52% 46% 54%;background:linear-gradient(145deg,#c56b2e,#8e3f1d 55%,#572611);box-shadow:inset -10px -12px 20px rgba(0,0,0,.16)}
    .hint{position:absolute;bottom:13px;font-size:12px;color:#6c655b;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);padding:7px 10px;border-radius:999px}
    .ar-link{display:block;text-decoration:none}
    .ar-button{width:100%;border:0;border-radius:16px;background:#181818;color:white;font-size:17px;font-weight:700;padding:17px 18px;cursor:pointer;text-align:center;box-shadow:0 9px 20px rgba(0,0,0,.14)}
    .ar-button:active{transform:translateY(1px)}
    .note{font-size:13px;line-height:1.5;color:#6d6d6d;text-align:center;margin:14px 4px 0}
    #compat{margin-top:14px;padding:12px 14px;border-radius:13px;background:#f4f1eb;font-size:13px;line-height:1.4;color:#5a554e;display:none}
    .ar-thumb{width:1px;height:1px;position:absolute;opacity:.001;pointer-events:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Realidade aumentada</div>
    <h1>Frango Guisado</h1>

    <div class="preview" aria-hidden="true">
      <div class="plate"><div class="food"></div></div>
      <div class="hint">Abra no iPhone para testar na mesa</div>
    </div>

    <a class="ar-link" rel="ar" href="3DModel.usdz" id="arLink">
      <img class="ar-thumb" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
      <div class="ar-button">Ver na minha mesa em AR</div>
    </a>

    <div id="compat"></div>
    <p class="note">No iPhone/iPad, o botão abre o modelo diretamente no Apple Quick Look.</p>
  </main>

  <script>
    const ua = navigator.userAgent || '';
    const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const compat = document.getElementById('compat');
    const link = document.getElementById('arLink');

    if (!isIOS) {
      compat.style.display = 'block';
      compat.textContent = 'Este modelo está em USDZ, formato de AR para iPhone/iPad. Para Android, será necessária também uma versão GLB.';
      link.addEventListener('click', (e) => {
        if (/Android/i.test(ua)) {
          e.preventDefault();
          compat.scrollIntoView({behavior:'smooth', block:'center'});
        }
      });
    }
  </script>
</body>
</html>
